<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
  <title id="title">How TailorCV works</title>
  <desc id="desc">Add your master resume and a job description, let Claude Code or Codex tailor the content, then get a PDF in your design.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#334155" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1100" height="230" rx="22" fill="#f8fafc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <path d="M236 113h104m-12-9 12 9-12 9M507 113h86m-12-9 12 9-12 9M760 113h104m-12-9 12 9-12 9" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#shadow)">
      <rect x="30" y="43" width="206" height="140" rx="17" fill="#fff" stroke="#dbeafe"/>
      <rect x="58" y="67" width="31" height="40" rx="5" fill="#ede9fe"/><path d="M65 78h17m-17 7h17m-17 7h12" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
      <text x="101" y="82" fill="#0f172a" font-size="17" font-weight="700">Your master</text><text x="101" y="105" fill="#475569" font-size="14">Resume + design</text>
      <text x="58" y="150" fill="#64748b" font-size="12">Keep your source private</text>

      <rect x="340" y="43" width="167" height="140" rx="17" fill="#fff" stroke="#cffafe"/>
      <rect x="406.5" y="57" width="34" height="34" rx="10" fill="#cffafe"/><path d="M414.5 68h18m-18 7h18m-18 7h12" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round"/>
      <text x="423.5" y="119" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Job description</text><text x="423.5" y="142" text-anchor="middle" fill="#475569" font-size="13">Paste the full job</text><text x="423.5" y="159" text-anchor="middle" fill="#475569" font-size="13">posting here</text><text x="423.5" y="175" text-anchor="middle" fill="#64748b" font-size="10">Agent reads the JD</text>

      <rect x="593" y="43" width="167" height="140" rx="17" fill="#fff" stroke="#e9d5ff"/>
      <circle cx="676.5" cy="74" r="17" fill="#f3e8ff"/><path d="M668.5 73a8 8 0 0 1 15-4m2 5a8 8 0 0 1-15 4m0-9v5h5m10 5v-5h-5" fill="none" stroke="#9333ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="676.5" y="119" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">AI agent</text><text x="676.5" y="142" text-anchor="middle" fill="#475569" font-size="13">Claude Code or Codex</text><text x="676.5" y="163" text-anchor="middle" fill="#64748b" font-size="11">Tailor, lint, build</text>

      <rect x="864" y="43" width="206" height="140" rx="17" fill="#fff" stroke="#bbf7d0"/>
      <rect x="951.5" y="57" width="31" height="40" rx="5" fill="#dcfce7"/><path d="M958.5 68h17m-17 7h17m-17 7h12" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
      <text x="967" y="121" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">Tailored PDF</text><text x="967" y="144" text-anchor="middle" fill="#475569" font-size="13">Your chosen layout</text>
      <text x="967" y="165" text-anchor="middle" fill="#64748b" font-size="11">Review each claim</text>
    </g>
  </g>
</svg>
