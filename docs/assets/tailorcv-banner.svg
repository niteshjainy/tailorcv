<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TailorCV — one master resume, tailored for each job</title>
  <desc id="desc">A colorful banner showing a master resume and job description flowing into a tailored PDF while keeping the original design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#20265b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050816" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="32" r="150" fill="#7c3aed" opacity=".12"/>
  <circle cx="640" cy="370" r="210" fill="#06b6d4" opacity=".08"/>
  <path d="M0 300C210 250 390 360 600 302s372-72 600-22v80H0z" fill="#fff" opacity=".025"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="64" y="55" width="38" height="38" rx="12" fill="url(#accent)"/>
    <path d="M75 65h16v4H75zm0 8h16v4H75zm0 8h11v4H75z" fill="#111827"/>
    <text x="114" y="83" fill="#e5e7eb" font-size="21" font-weight="700" letter-spacing="1">TAILORCV</text>

    <text x="64" y="164" fill="#fff" font-size="47" font-weight="750" letter-spacing="-1.4">One master resume.</text>
    <text x="64" y="218" fill="url(#accent)" font-size="47" font-weight="750" letter-spacing="-1.4">Tailored for every job.</text>
    <text x="67" y="263" fill="#cbd5e1" font-size="19">Use Claude Code or Codex to match a job description,</text>
    <text x="67" y="291" fill="#cbd5e1" font-size="19">then build a clean PDF in your original resume design.</text>

    <g filter="url(#shadow)">
      <rect x="714" y="72" width="167" height="212" rx="16" fill="#fff"/>
      <rect x="730" y="89" width="55" height="7" rx="3.5" fill="#7c3aed"/>
      <rect x="730" y="108" width="127" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="730" y="120" width="110" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="730" y="145" width="128" height="3" rx="1.5" fill="#22d3ee"/>
      <rect x="730" y="160" width="123" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="730" y="173" width="115" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="730" y="186" width="126" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="730" y="211" width="128" height="3" rx="1.5" fill="#22d3ee"/>
      <rect x="730" y="226" width="120" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="730" y="239" width="94" height="5" rx="2.5" fill="#e2e8f0"/>
      <text x="730" y="269" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">YOUR MASTER DESIGN</text>
    </g>

    <path d="M895 178h76m-14-14 14 14-14 14" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="991" y="103" width="150" height="153" rx="18" fill="#fff"/>
      <rect x="1011" y="124" width="54" height="7" rx="3.5" fill="#f97316"/>
      <rect x="1011" y="145" width="108" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="1011" y="158" width="100" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="1011" y="171" width="108" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="1011" y="192" width="108" height="3" rx="1.5" fill="#f97316"/>
      <rect x="1011" y="207" width="94" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="1011" y="220" width="106" height="5" rx="2.5" fill="#e2e8f0"/>
      <circle cx="1117" cy="240" r="14" fill="#dcfce7"/>
      <path d="m1110 240 5 5 9-11" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1011" y="276" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">TAILORED PDF</text>
    </g>
  </g>
</svg>
